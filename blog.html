<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Блог психолога. Статьи о психологии, отношениях, саморазвитии.">
    <meta name="keywords" content="блог, психология, статьи, саморазвитие">
    <title>Блог | Психолог</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .blog-list {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .blog-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
            transition: all var(--transition);
        }
        
        .blog-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px var(--shadow);
            border-color: var(--accent-light);
        }
        
        .blog-card__date {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 10px;
        }
        
        .blog-card__title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text);
        }
        
        .blog-card__title a {
            color: inherit;
            text-decoration: none;
            transition: color var(--transition);
        }
        
        .blog-card__title a:hover {
            color: var(--accent);
        }
        
        .blog-card__excerpt {
            color: var(--text-secondary);
            margin-bottom: 15px;
            line-height: 1.7;
        }
        
        .blog-card__tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .blog-tag {
            font-size: 0.8rem;
            padding: 4px 12px;
            background: var(--bg-secondary);
            border-radius: 20px;
            color: var(--text-light);
        }
        
        .blog-article {
            max-width: 800px;
            margin: 0 auto;
            padding: 100px 20px 60px;
        }
        
        .blog-article__header {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border);
        }
        
        .blog-article__date {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        
        .blog-article__title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 20px;
            color: var(--text);
        }
        
        .blog-article__content {
            color: var(--text-secondary);
            line-height: 1.8;
        }
        
        .blog-article__content h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            margin: 40px 0 20px;
            color: var(--text);
        }
        
        .blog-article__content h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            margin: 30px 0 15px;
            color: var(--text);
        }
        
        .blog-article__content p {
            margin-bottom: 20px;
        }
        
        .blog-article__content ul, 
        .blog-article__content ol {
            margin-bottom: 20px;
            padding-left: 25px;
        }
        
        .blog-article__content li {
            margin-bottom: 10px;
        }
        
        .blog-article__content blockquote {
            border-left: 4px solid var(--accent);
            padding-left: 20px;
            margin: 25px 0;
            font-style: italic;
            color: var(--text-light);
        }
        
        .blog-article__content a {
            color: var(--accent);
        }
        
        .blog-article__content img {
            max-width: 100%;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
            text-decoration: none;
            margin-bottom: 30px;
            font-weight: 500;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        
        .error {
            text-align: center;
            padding: 60px 20px;
            color: #c0392b;
        }
        
        .blog-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <a href="index.html" class="logo">Люция Соловьева</a>
            <nav class="nav">
                <a href="index.html#about" class="nav__link">Обо мне</a>
                <a href="index.html#services" class="nav__link">Услуги</a>
                <a href="index.html#reviews" class="nav__link">Отзывы</a>
                <a href="index.html#pricing" class="nav__link">Цены</a>
                <a href="index.html#faq" class="nav__link">FAQ</a>
                <a href="blog.html" class="nav__link">Блог</a>
                <a href="index.html#contacts" class="nav__link">Контакты</a>
            </nav>
            <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
                <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Меню">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main id="blogContent">
        <div class="loading">Загрузка статей...</div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Имя Фамилия. Все права защищены.</p>
        </div>
    </footer>

    <button class="scroll-top" id="scrollTop" aria-label="Наверх">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>

    <script src="js/script.js"></script>
    <script src="js/blog.js"></script>
</body>
</html>
